# The matrix a release can be qualified against: the streams that exist and
# the named selections over them that decide how much of the matrix a given
# run covers. What is qualified is in qualification.yaml, and how each
# component resolves to a version is in registry.yaml.
#
# The streams below are the ones that exist: the Forge lanes on GB200 and L40S
# capacity, and the DSX lanes on L40S and VR200 capacity.
# A policy naming capabilities no runner has produces plans that nothing can
# schedule, so a stream is added with the runner that backs it.

apiVersion: nvke.nvidia.com/v1alpha1
kind: QualificationPolicy
metadata:
  name: nvke
  description: The streams a release can be qualified against and the scopes over them.
spec:
  scopes:
    # Only Ubuntu 24.04 on GB200, on every arch and minor that has a stream for
    # it.
    golden-path:
      selector: {ubuntu: "24.04", gpu: gb200}
    # Ubuntu 24.04 on L40S at Forge site-1: one stream, amd64, and the only GPU
    # shape it offers. Forge is named because the DSX L40S stream carries the
    # same gpu and would otherwise join. The qualify-e2e-l40s label selects
    # this instead of golden-path.
    l40s:
      selector: {provider: forge, ubuntu: "24.04", gpu: l40s}

    # Every DSX stream. Provider is what separates the two lanes: DSX carries
    # its own gpu models, so none of the GPU scopes above reaches it.
    dsx:
      selector: {provider: dsx}

    # One DSX site each. `dsx` fans out to both, so these name one: what a run
    # against a single site wants, and how a known-good lane stays off hardware
    # that is still being proven. The qualify-e2e-dsx label selects dsx-amd64;
    # dsx-arm64 and dsx are reached through QUALIFY_E2E_SCOPE.
    dsx-amd64:
      selector: {provider: dsx, arch: amd64}
    dsx-arm64:
      selector: {provider: dsx, arch: arm64}

    # Every Forge stream. What the weekly run covers, and adding a Forge minor
    # is adding a stream rather than editing this.
    #
    # It selects on provider rather than carrying no selector, which is what it
    # used to do, because `full` also decides the stage: a dispatch defaults to
    # stage full, and a scope that matched every stream put a lane into every
    # weekly run that could only fail, whatever the versions under test.
    #
    # So this is not "every stream" but "every stream a full run can finish".
    # A DSX tenant spec now exists --- nicoDSXTenant --- so the obstacle is no
    # longer that the suite cannot build one. It is that no DSX tenant has yet
    # reached provisioned on the lane: every run so far has stalled in
    # NodePreflight, the node healthy and its agent reachable, with cloud-init
    # reporting a runcmd that failed. Taking the selector off before that is
    # green would put a known-red lane into every weekly run, which is the
    # thing this selector exists to prevent. It comes off when the lane
    # finishes a tenant, not when the spec exists.
    full:
      selector: {provider: forge}

  # A stream names capabilities, not the infrastructure that satisfies them.
  # Which runner label, site, or subnet a capability resolves to is an
  # environment knob and belongs to the e2e suite's own config, so that the
  # suite stays runnable by hand and by a second organisation.
  #
  # `arch` is the architecture of the site and control-plane node. GPU workers
  # can differ, and the GPU model decides theirs, so `arch` does not say which
  # node images a run needs.
  #
  # A stream is named <provider>-<gpu>-<arch>-ubuntu-<series>-kube-<minor>, so
  # two streams that differ only in GPU model do not share a name. A stream
  # that declares no gpu omits that segment rather than inventing a value for
  # it. The name is the key of everything recorded for a stream.
  streams:
    - name: forge-gb200-amd64-ubuntu-24.04-kube-1.36
      capabilities: {provider: forge, gpu: gb200, arch: amd64, ubuntu: "24.04", kube: "1.36"}
    - name: forge-gb200-arm64-ubuntu-24.04-kube-1.36
      capabilities: {provider: forge, gpu: gb200, arch: arm64, ubuntu: "24.04", kube: "1.36"}
    - name: forge-gb200-amd64-ubuntu-26.04-kube-1.36
      capabilities: {provider: forge, gpu: gb200, arch: amd64, ubuntu: "26.04", kube: "1.36"}
    - name: forge-gb200-arm64-ubuntu-26.04-kube-1.36
      capabilities: {provider: forge, gpu: gb200, arch: arm64, ubuntu: "26.04", kube: "1.36"}
    - name: forge-l40s-amd64-ubuntu-24.04-kube-1.36
      capabilities: {provider: forge, gpu: l40s, arch: amd64, ubuntu: "24.04", kube: "1.36"}
    - name: forge-l40s-amd64-ubuntu-26.04-kube-1.36
      capabilities: {provider: forge, gpu: l40s, arch: amd64, ubuntu: "26.04", kube: "1.36"}

    # DSX site-1, amd64 and l40s because that is what the hardware is, not a
    # choice --- every machine it owns is a Lenovo SR675 V3 OVX, AMD EPYC
    # carrying eight L40S. The arm64 stream below is a second site, with its
    # own ids and its own API host.
    #
    # kube 1.36 matches the Forge streams. The recorded DSX exercise reached
    # CoreDNS on a 1.34.2 tenant, so 1.36 is unproven on this substrate.
    - name: dsx-l40s-amd64-ubuntu-24.04-kube-1.36
      capabilities: {provider: dsx, gpu: l40s, arch: amd64, ubuntu: "24.04", kube: "1.36"}

    # DSX site-2, arm64 and vr200 because every machine it owns is a Vera
    # Rubin NVL72 tray on an Olympus CPU.
    #
    # 26.04 where site-1 is 24.04, so the two DSX streams differ in series as
    # well as arch. The image is there: os-image-artifact builds and publishes
    # 26.04 for both arches on every beta, under
    # nvke-packages/os-image/releases/<version>/<arch>/. Proven on 2026-11-02:
    # run 41481335380 took this stream through stage full --- site controller,
    # stack and a two-node tenant --- at 51 of 51 specs.
    - name: dsx-vr200-arm64-ubuntu-26.04-kube-1.36
      capabilities: {provider: dsx, gpu: vr200, arch: arm64, ubuntu: "26.04", kube: "1.36"}
